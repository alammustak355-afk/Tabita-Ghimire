name: Build ConnectAI CRM Android APK & Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install API 35 SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Release Keystore (Optional GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/connectai-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/connectai-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded from ANDROID_KEYSTORE_BASE64 secret."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; building unsigned release AAB."
          fi

      - name: Run Unit Tests & Build Debug APK for Direct Phone Testing
        run: |
          if [ -f "android-app/gradlew" ]; then
            cd android-app
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Build Release Android App Bundle (.aab) for Google Play Console
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android-app/gradlew" ]; then
            cd android-app
          fi
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: connectai-crm-debug-apk
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: connectai-crm-release-aab
          path: |
            android-app/app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
